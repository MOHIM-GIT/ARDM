# Netlify Build and Deployment Configuration for ARDM Academy
# Ensures Vite SPA deploys smoothly with automatic directory detection,
# clean client-side routing, and optimized caching.

[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"
  NPM_FLAGS = "--legacy-peer-deps"
  VITE_BASE_URL = "/"

# Single Page Application (SPA) catch-all rewrite rule
# Ensures direct visits and page refreshes on /admin, /courses, /mock-tests, etc., work seamlessly
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Security and caching headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
